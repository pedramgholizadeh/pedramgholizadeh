<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Resume</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            font-family: Arial, sans-serif;
        }
        
        .container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }
        
        .header {
            background-color: #444;
            padding: 20px;
            border-bottom: 1px solid #555;
        }
        
        .header h1 {
            color: #fff;
            margin: 0;
        }
        
        .main {
            padding: 40px;
        }
        
        .coming-soon {
            background-color: #444;
            padding: 20px;
            border: 1px solid #555;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .coming-soon h2 {
            color: #fff;
            margin: 0;
        }
        
        .coming-soon p {
            color: #ccc;
            margin: 20px 0;
        }
        
        /* 3D Design */
        .coming-soon {
            transform: perspective(500px) rotateY(20deg);
            transition: transform 0.5s;
        }
        
        .coming-soon:hover {
            transform: perspective(500px) rotateY(0deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Developer Resume</h1>
        </div>
        <div class="main">
            <div class="coming-soon">
                <h2>Pedram Gholizadeh</h2>
                <p>a simple web developer!</p>
            </div>
        </div>
    </div>

    
</body>
</html>
