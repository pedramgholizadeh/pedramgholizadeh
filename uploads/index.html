<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>File Browser</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<style>
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}
.bg-white.rounded-xl.shadow-sm.hover\:shadow-md.transition.p-4.flex.flex-col.items-center.text-center.relative:hover {
    cursor:crosshair
}

</style>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Downloads</h1>
    <button id="backBtn" class="hidden flex items-center gap-1 text-sm text-blue-600 hover:underline">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      Back
    </button>
  </div>

  <!-- Breadcrumb -->
  <div id="breadcrumb" class="text-sm text-gray-500 mb-6"></div>

  <!-- Grid -->
  <div id="fileContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>

</div>

<script>
const owner = "pedramgholizadeh";
const repo = "pedramgholizadeh";
const branch = "Main";

let currentPath = "uploads";
let historyStack = [];

function formatSize(bytes) {
  if (!bytes) return "";
  const sizes = ["B","KB","MB","GB"];
  let i = Math.floor(Math.log(bytes)/Math.log(1024));
  return (bytes/Math.pow(1024,i)).toFixed(1)+" "+sizes[i];
}

function getFileIcon(name, type) {
  if (type === "dir") return "folder";

  const ext = name.split('.').pop().toLowerCase();

  const map = {
    pdf: "picture_as_pdf",
    json: "data_object",
    zip: "folder_zip",
    dmg: "disc_full",
    mp3: "music_note",
    mp4: "movie",
    jpg: "image",
    jpeg: "image",
    png: "image"
  };

  return map[ext] || "description";
}

function updateBreadcrumb(path) {
  const container = document.getElementById("breadcrumb");
  const parts = path.split("/");
  let fullPath = "";

  container.innerHTML = parts.map((part, i) => {
    fullPath += (i === 0 ? part : "/" + part);
    return `<span class="cursor-pointer hover:underline" onclick="navigate('${fullPath}')">${part}</span>`;
  }).join(" / ");
}

async function loadDirectory(path) {
  currentPath = path;
  updateBreadcrumb(path);

  document.getElementById("fileContainer").innerHTML = "";

  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`);
  const data = await res.json();

  data.forEach(item => {
    const icon = getFileIcon(item.name, item.type);

    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 flex flex-col items-center text-center relative";

    if (item.type === "dir") {
      card.innerHTML = `
        <span class="material-symbols-outlined text-5xl text-yellow-500 mb-2">${icon}</span>
        <p class="text-sm font-medium truncate w-full">${item.name}</p>
      `;

      card.onclick = () => {
        historyStack.push(currentPath);
        document.getElementById("backBtn").classList.remove("hidden");
        loadDirectory(item.path);
      };

    } else {

      card.innerHTML = `
        <span class="material-symbols-outlined text-5xl text-blue-500 mb-2">${icon}</span>
        <p class="text-sm font-medium truncate w-full">${item.name}</p>
        <p class="text-xs text-gray-400 mt-1">${formatSize(item.size)}</p>
        <a href="${item.download_url}" target="_blank"
           class="absolute top-2 right-2 text-gray-400 hover:text-blue-600">
          <span class="material-symbols-outlined text-base">download</span>
        </a>
      `;
    }

    document.getElementById("fileContainer").appendChild(card);
  });
}

function navigate(path) {
  historyStack.push(currentPath);
  document.getElementById("backBtn").classList.remove("hidden");
  loadDirectory(path);
}

document.getElementById("backBtn").onclick = () => {
  if (historyStack.length === 0) return;
  const prev = historyStack.pop();
  if (historyStack.length === 0) {
    document.getElementById("backBtn").classList.add("hidden");
  }
  loadDirectory(prev);
};

loadDirectory("uploads");
</script>

</body>
</html>
