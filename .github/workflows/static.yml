# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["Main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp asset versions
        env:
          SITE_VERSION: ${{ github.sha }}
        # index.html is the only file Cloudflare never edge-caches, so the commit
        # SHA is written into it here and every script, style and JSON fetch then
        # carries it as a query string. Without this a deploy can sit invisible
        # behind four hours of edge cache, which is what made translation look
        # like it "only flips RTL".
        run: |
          sed -i "s|__SITE_VERSION__|${SITE_VERSION:0:8}|g" index.html
          grep -q "SITE_VERSION = '${SITE_VERSION:0:8}'" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
